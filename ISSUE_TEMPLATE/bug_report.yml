name: 🐛 Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! 🙏
        **Found a security issue?** Please don't open an issue. Follow our [security policy](https://github.com/tivtav/.github/blob/main/SECURITY.md) instead.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or logs
      description: Drag and drop images here, or paste relevant log output.
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: e.g. Chrome 130 on macOS, iOS app 2.4.1
