name: ✨ Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Got an idea? We'd love to hear it! 💡
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the problem or frustration behind the request.
      placeholder: I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other solutions or workarounds you've thought about.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, screenshots or anything else that helps.
