name: runtime-guard
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate runtime-standards.json
        run: python3 -m json.tool runtime-standards.json > /dev/null
      - name: Unit tests
        run: python3 -I -m unittest discover -s actions/runtime-guard/tests -v
      - name: Run the action on this repository
        uses: ./actions/runtime-guard
